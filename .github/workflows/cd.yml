name: ZeroPass CD — Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target'
        required: true
        default: 'preprod'
        type: choice
        options:
          - preprod
          - staging

permissions:
  contents: write
  packages: write

jobs:
  # ── 1. Build & Verify ─────────────────────────────────────────────────────────
  build:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME:-$(date +%Y%m%d-%H%M%S)}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Install & pin Compact compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          compact update 0.31.1

      - name: Compile Compact smart contract
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run frontend:build

      - name: Package release
        run: |
          mkdir -p release-artifacts
          cp -r contracts/managed/ZeroPass release-artifacts/contract
          cp -r frontend/dist             release-artifacts/frontend
          echo "${{ steps.version.outputs.version }}" > release-artifacts/VERSION
          echo "${{ github.sha }}"         > release-artifacts/COMMIT
          tar -czf zeropass-${{ steps.version.outputs.version }}.tar.gz release-artifacts/

      - name: Upload release tarball
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: zeropass-${{ steps.version.outputs.version }}.tar.gz
          retention-days: 30

  # ── 2. Create GitHub Release ──────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: release-package

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges | head -30)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges | head -30)
          fi
          echo "CHANGES<<EOF" >> $GITHUB_ENV
          echo "$CHANGES"     >> $GITHUB_ENV
          echo "EOF"          >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ZeroPass ${{ needs.build.outputs.version }}
          body: |
            ## 🔐 ZeroPass ${{ needs.build.outputs.version }}

            **Confidential Credentials with Zero-Knowledge Proofs on Midnight Network**

            ### 📋 What's Changed
            ${{ env.CHANGES }}

            ### 📜 Contract
            - Network: **Midnight Preprod Testnet**
            - Compiler: Compact 0.31.1
            - Circuits: `issueCredential`, `approveCredential`, `proveEligibility`, `revokeCredential`

            ### 🔗 Links
            - Frontend: https://zero-pass.vercel.app
            - X Profile: https://x.com/ZeroPass_00
          files: |
            zeropass-${{ needs.build.outputs.version }}.tar.gz
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, 'alpha') || contains(needs.build.outputs.version, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. Deploy to Vercel ───────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ github.event.inputs.environment || 'preprod' }}
      url: https://zero-pass.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install & build
        run: |
          npm ci
          npm ci --prefix frontend
          npm run frontend:build

      - name: Deploy to Vercel (Production)
        run: |
          vercel deploy ./frontend/dist \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --prod \
            --yes \
            --name=zeropass
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        continue-on-error: true  # Don't fail if Vercel secrets not configured
